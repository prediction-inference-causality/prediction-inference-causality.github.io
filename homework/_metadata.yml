
format: 
  html:
    code-annotations: hover
    filters: 
      - custom-callout.lua
    css:
      - homework.css
    callout-appearance: simple
    callout-icon: false
    highlight-style: haddock
    df-print: paged
    embed-resources: true
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
          loader: {load: ['[tex]/physics']},
          tex: {packages: {'[+]': ['physics']}}
          }
    
        </script>
execute: 
  echo: false
  message: false
  warning: false
knitr:
  opts_chunk:
    dev.args:
      bg: transparent
