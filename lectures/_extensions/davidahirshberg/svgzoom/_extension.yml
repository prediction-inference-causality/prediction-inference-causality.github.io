title: svgzoom
author: David A. Hirshberg
version: 0.0.0
quarto-required: ">=1.2.198"
contributes:
  filters:
    - svg-inline.lua
  revealjs-plugins:
    - name: RevealSVGZoom
      script:
        - d3.v7.min.js 
        - svg-zoom.js 
      config:
        svgzoom:
          max-zoom-factor: 10
          linked-by-default: true
