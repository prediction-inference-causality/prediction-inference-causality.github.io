title: svgPanZoom
author: David A. Hirshberg
version: 0.0.0
quarto-required: ">=1.2.198"
contributes:
  filters:
    - svg-embed.lua
  revealjs-plugins:
    - name: RevealSVGPanZoom
      script:
        - svg-pan-zoom.min.js
        - RevealSVGPanZoom.js 
      stylesheet: RevealSVGPanZoom.css
      config:
        panzoom:
          controls: true