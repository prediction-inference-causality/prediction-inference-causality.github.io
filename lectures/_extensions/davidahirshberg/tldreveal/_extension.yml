title: tldreveal
author: David A. Hirshberg [a trivial quarto wrapper for arthurrump's tldreveal plugin]
version: 0.0.0
quarto-required: ">=1.2.198"
contributes:
  revealjs-plugins:
    - name: tldreveal
      script:
        - index.js
        - tldreveal-wrapper.js
      stylesheet: 
        - index.css
        - move-toolbar.css
      config:
        isDarkMode: false
