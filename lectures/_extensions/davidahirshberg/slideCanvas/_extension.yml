title: slideCanvas
author: David A. Hirshberg
version: 0.0.0
quarto-required: ">=1.2.198"
contributes:
  revealjs-plugins:
    - name: RevealSlideCanvas
      script:
        - coloris.js
        - RevealSlideCanvas.js
      stylesheet: 
        - coloris.css
      config:
        pen:
          highlight-fade-time: 500
          highlight-fade-steps: 10
          max-size: 50
          min-size: 5
          default-size: 10
          swatches:
            - '#ecc30b77'
            - '#220022ff'
            - '#067bc2ff'
            - '#80e37766'
            - '#ffffff00'
            - '#00ff0050'