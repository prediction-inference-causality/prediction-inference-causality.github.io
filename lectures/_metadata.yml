format: 
  clean-revealjs:
    controls: true
    controls-layout: bottom-right
    embed-resources: true
    height: 1000
    width: 1290
    theme: [default, "class.scss"]
    smaller: true
    slide-number: true
    pdf-separate-fragments: true
    fig-format: svg
    default-image-extension: png
    html-math-method: mathjax
    include-in-header: 
      text: |
        <link rel="stylesheet" href="Coloris/src/coloris.css"></script>
        <script src="Coloris/src/coloris.js"></script>
        <script src="slide-canvas.js"></script>
        <script>
          window.MathJax = {
          loader: {load: ['[tex]/physics']},
          tex: {packages: {'[+]': ['physics']}}
          }
        </script>
knitr:
  opts_chunk:
    dev.args:
      bg: transparent
