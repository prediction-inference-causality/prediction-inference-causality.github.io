filters:
  - svgPanZoom
revealjs-plugins:
  - svgPanZoom
  - slideCanvas
format: 
  clean-revealjs:
    controls: true
    controls-layout: bottom-right
    embed-resources: true
    height: 1000
    width: 1290
    theme: [default, "class.scss"]
    smaller: false
    slide-number: true
    pdf-separate-fragments: true
    fig-format: svg
    default-image-extension: png
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
            loader: {load: ['[tex]/physics']},
            tex: {packages: {'[+]': ['physics']}}
          }
        </script>
knitr:
  opts_chunk:
    dev.args:
      bg: transparent
