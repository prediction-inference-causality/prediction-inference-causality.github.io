engine: "knitr"
format: 
  revealjs:
    crossrefs-hover: true
    svgzoom:
      max-zoom-factor: 20
      linked-by-default: true
    touch: false
    scrollable: true
    controls: true
    controls-layout: bottom-right
    fig-align: center
    fig-width: 14
    embed-resources: true
    height: 1000
    width: 1290
    margin: .02
    theme: [default, "class.scss"]
    smaller: true
    slide-number: true
    pdf-separate-fragments: true
    default-image-extension: png
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
            loader: {load: ['[tex]/physics']},
            tex: {packages: {'[+]': ['physics']}}
          }
        </script>
webr:
  packages:
  - "ggplot2"
  - "purrr"
  - "dplyr"
  - "tidyr"
  cell-options:
    autorun: true
    fig-width: 10
  editor-quick-suggestions: true
  theme: vs-light
knitr:
  opts_chunk:
    dev: svglite
    dev.args:
      bg: transparent
filters:
  - svgzoom
  - webr
revealjs-plugins:
  - svgzoom
  - tldreveal
