format: 
  revealjs:
    svgzoom:
      max-zoom-factor: 20
      linked-by-default: true
    touch: false
    scrollable: true
    controls: true
    controls-layout: bottom-right
    embed-resources: true
    height: 1000
    width: 1290
    margin: .02
    theme: [default, "clean.scss", "class.scss"]
    smaller: true
    slide-number: true
    pdf-separate-fragments: true
    default-image-extension: png
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
            loader: {load: ['[tex]/physics']},
            tex: {packages: {'[+]': ['physics']}}
          }
        </script>
filters:
  - svgzoom
revealjs-plugins:
  - svgzoom
  - tldreveal
knitr:
  opts_chunk:
    dev: svglite
    dev.args:
      bg: transparent