engine: "knitr"
format: 
  live-revealjs:
    webr:
      cell-options:
        autorun: true
        fig-width: 10
      packages:
        - "ggplot2"
        - "purrr"
        - "dplyr"
        - "tidyr"
    code-annotations: select
    crossrefs-hover: true
    reference-location: document
    crossref:
      sec-prefix: "Slide"
    svgzoom:
      max-zoom-factor: 20
      linked-by-default: true
    touch: false
    scrollable: true
    controls: true
    controls-layout: edges 
    fig-align: center
    fig-width: 14
    embed-resources: true
    height: 1000
    width: 1290
    margin: .02
    theme: [default, "class.scss"]
    smaller: true
    slide-number: true
    pdf-separate-fragments: true
    default-image-extension: png
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
            options : {
              menuOptions: {
                settings: {
                  assistiveMml: false, 
                  collapsible: false,  
                  explorer: false    
                }
              }
            },
            loader: {load: ['[tex]/physics', '[tex]/unicode']},
            tex: {packages: {'[+]': ['physics', 'unicode']}}
          }
        </script>
knitr:
  opts_chunk:
    dev: svglite
    dev.args:
      bg: transparent
filters:
  - svgzoom
revealjs-plugins:
  - svgzoom
  - tldreveal
