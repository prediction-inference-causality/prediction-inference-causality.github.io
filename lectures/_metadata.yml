format: 
  live-revealjs:
    theme: [default, "class.scss"]
    code-annotations: hover
    filters: 
      - homework/custom-callout.lua
    callout-appearance: simple
    callout-icon: false
    highlight-style: haddock
    df-print: paged
    embed-resources: false
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
            options : {
              menuOptions: {
                settings: {
                  assistiveMml: false,
                  collapsible: false,  
                  explorer: false    
                }
              }
            },
            loader: {load: ['[tex]/physics', '[tex]/unicode']},
            tex: {packages: {'[+]': ['physics', 'unicode']}}
          }
        </script>
        
knitr:
  opts_chunk:
    dev: svglite
    dev.args:
      bg: transparent
webr:
  cell-options:
    autorun: true
    fig-retina: true
  packages:
    - "ggplot2"
    - "purrr"
    - "dplyr"
    - "tidyr"

execute: 
  echo: false
  message: false
  warning: false 