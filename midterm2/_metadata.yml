
format: 
  html:
    filters: 
      - custom-callout.lua
    df-print: kable
    embed-resources: true
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
          loader: {load: ['[tex]/physics']},
          tex: {packages: {'[+]': ['physics']}}
          }
    
        </script>
        <style>
          .callout.callout-style-default.callout-exercise>.callout-header { 
            background-color: #ED8275
          } 
          .callout.callout-style-default.callout-solution>.callout-header { 
            background-color: #75DFED
          } 
        </style>
execute: 
  echo: false
  message: false
  warning: false
knitr:
  opts_chunk:
    fig.path: generated-figures/
    dev.args:
      bg: transparent