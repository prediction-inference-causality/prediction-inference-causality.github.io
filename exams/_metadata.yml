
format: 
  html:
    filters: 
      - assignment-callout.lua
    df-print: kable
    embed-resources: false
    fig-format: svg
    html-math-method: mathjax
    include-in-header: 
      text: |
        <script>
          window.MathJax = {
          loader: {load: ['[tex]/physics']},
          tex: {packages: {'[+]': ['physics']}}
          }
    
        </script>
        <link rel="stylesheet" href="exam.css" />
execute: 
  echo: false
  message: false
  warning: false
knitr:
  opts_chunk:
    fig.path: generated-figures/
    dev.args:
      bg: transparent
