    - lectures/Lecture2-prose.qmd
    - lectures/Lab2.qmd
    - homework/week1-homework.qmd
    - lectures/Lecture3.qmd
    - lectures/Lab3.qmd
    - homework/week2-homework.qmd
    - lectures/Lecture4.qmd
    - lectures/Lecture5.qmd
    - lectures/Lab4.qmd
    - homework/week3-homework.qmd
    - lectures/Lecture6.qmd
    - exams/practice-midterm-1.qmd
    - lectures/Lecture7.qmd
    - lectures/Lecture8.qmd
    - lectures/Lab5.qmd
    - lectures/Lecture9.qmd
    - lectures/Lab6.qmd
